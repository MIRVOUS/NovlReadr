name: Build Debug APK

on:
  workflow_dispatch:

jobs:
  buildRelease:
    name: Build Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup APK signing
        run: |
          echo -n ${{ secrets.SIGNING_KEY }} | base64 -d > app/novlreadr.jks
          echo storeFile=novlreadr.jks > signing.properties
          echo storePassword=${{ secrets.KEY_STORE_PASSWORD }} >> signing.properties
          echo keyAlias=${{ secrets.ALIAS }} >> signing.properties
          echo keyPassword=${{ secrets.KEY_PASSWORD }} >> signing.properties

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleFullRelease -PsigningPropertiesPath=signing.properties

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NovlReadr-debug
         path: app/build/outputs/apk/full/release/*.apk
         retention-days: 7
